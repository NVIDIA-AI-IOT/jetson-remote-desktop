name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Check read-only CLI workflows
        shell: bash
        run: |
          ./jetson-remote --version
          ./jetson-remote inspect --json > "$RUNNER_TEMP/inspect.json"
          ./jetson-remote plan --report "$RUNNER_TEMP/inspect.json" --json > "$RUNNER_TEMP/plan.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          output = Path(os.environ['RUNNER_TEMP'])
          report = json.loads((output / 'inspect.json').read_text())
          plan = json.loads((output / 'plan.json').read_text())
          assert report['read_only'] is True
          assert plan['read_only'] is True
          assert plan['changes_proposed'] == []
          PY

